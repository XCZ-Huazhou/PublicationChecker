<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PublicationChecker 期刊分区查询</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <span class="logo">P</span>
        <div>
          <strong>PublicationChecker</strong>
          <div class="hint">期刊分区查询</div>
        </div>
        <span class="ver" id="ext-version"></span>
      </header>

      <section class="card">
        <h2>当前数据库</h2>
        <div id="db-info" class="info">读取中…</div>
      </section>

      <section class="card">
        <h2>反馈与主页</h2>
        <p class="hint">
          遇到 bug 或有改进建议，到 GitHub 提 issue。打开时会自动带上扩展版本和数据库信息，方便定位。
        </p>
        <div class="card-actions">
          <button id="feedback-btn" type="button">到 GitHub 提 issue</button>
          <a
            id="repo-home"
            class="repo-link-btn"
            href="#"
            target="_blank"
            rel="noreferrer"
            >GitHub 仓库</a
          >
        </div>
      </section>

      <div id="status" class="status" hidden></div>
    </div>
    <script src="lib/search-core.js"></script>
    <script src="options.js"></script>
  </body>
</html>
